name: Git Plugin Verification

on:
  pull_request:
    paths:
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "assets/**"
      - "docs/assets/utsuri.jpg"
      - "plugins/utsuri/**"
      - "skills/utsuri-review/**"
      - "docs/compatibility/plugin-runtime.json"
      - "package.json"
      - "bun.lock"
      - "packages/*/package.json"
      - "packages/cli/src/**"
      - "packages/review-mcp-server/src/**"
      - "packages/report-model/src/**"
      - "packages/security/src/**"
      - "packages/session-binding/src/**"
      - "schemas/**"
      - "toolchain-policy.json"
      - "scripts/safe-chain.mjs"
      - "scripts/plugin-*.mjs"
      - "scripts/verify-plugin.mjs"
      - "scripts/verify-published-cli.mjs"
      - "scripts/verify-release-layout.mjs"
      - "tests/integration/plugin-*.test.ts"
      - "tests/integration/verify-published-cli.test.ts"
      - ".github/workflows/git-plugin-verification.yml"
      - ".github/workflows/plugin-promotion.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-plugin-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Install and verify Safe-chain 1.5.14
        run: |
          utsuri_safe_chain_asset="$(node -p "require('./toolchain-policy.json').safeChain.assets['linux-x64']")"
          utsuri_safe_chain_expected="$(node -p "require('./toolchain-policy.json').safeChain.sha256['linux-x64']")"
          utsuri_safe_chain_target="${HOME}/.safe-chain/bin/safe-chain"
          mkdir -p "$(dirname "${utsuri_safe_chain_target}")"
          curl --fail --silent --show-error --location \
            "https://github.com/AikidoSec/safe-chain/releases/download/1.5.14/${utsuri_safe_chain_asset}" \
            --output "${utsuri_safe_chain_target}"
          node -e "const fs=require('node:fs');const c=require('node:crypto');const got=c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');if(got!==process.argv[2])throw new Error('Safe-chain digest mismatch')" \
            "${utsuri_safe_chain_target}" "${utsuri_safe_chain_expected}"
          chmod 0755 "${utsuri_safe_chain_target}"
          node scripts/safe-chain.mjs --version
          node scripts/safe-chain.mjs setup-ci
      - name: Install the exact lockfile and supported hosts
        run: |
          node scripts/safe-chain.mjs bun install --frozen-lockfile
          node scripts/safe-chain.mjs npm install --global --ignore-scripts \
            @openai/codex@0.146.0
          utsuri_claude_root="${RUNNER_TEMP}/utsuri-claude-2.1.220"
          mkdir -p "${utsuri_claude_root}"
          node scripts/safe-chain.mjs npm install \
            --prefix "${utsuri_claude_root}" \
            --no-save \
            --no-package-lock \
            --ignore-scripts \
            @anthropic-ai/claude-code@2.1.220 \
            @anthropic-ai/claude-code-linux-x64@2.1.220
          utsuri_claude_native="${utsuri_claude_root}/node_modules/@anthropic-ai/claude-code-linux-x64/claude"
          test -x "${utsuri_claude_native}"
          utsuri_host_bin="${RUNNER_TEMP}/utsuri-host-bin"
          mkdir -p "${utsuri_host_bin}"
          ln -s "${utsuri_claude_native}" "${utsuri_host_bin}/claude"
          export PATH="${utsuri_host_bin}:${PATH}"
          echo "${utsuri_host_bin}" >> "${GITHUB_PATH}"
          test "$(codex --version)" = "codex-cli 0.146.0"
          test "$(command -v claude)" = "${utsuri_host_bin}/claude"
          test "$(claude --version | awk '{ print $1 }')" = "2.1.220"
      - name: Build the native focused-test input
        run: node scripts/safe-chain.mjs bun run native:build
      - name: Verify the static Git Plugin and focused contracts
        run: |
          node scripts/safe-chain.mjs bun run plugin:verify
          node scripts/safe-chain.mjs bun test \
            tests/integration/plugin-distribution.test.ts \
            tests/integration/plugin-promote.test.ts \
            tests/integration/plugin-runtime-probe.test.ts \
            tests/integration/verify-published-cli.test.ts \
            packages/cli/src/cli.test.ts \
            packages/cli/src/feedback.test.ts \
            packages/cli/src/mcp.test.ts \
            packages/review-mcp-server/src/run-registry.test.ts
      - name: Probe Codex 0.146.0 and Claude Code 2.1.220 host contracts
        run: |
          node scripts/plugin-runtime-probe.mjs --host codex --version 0.146.0
          node scripts/plugin-runtime-probe.mjs --host claude --version 2.1.220
      - name: Strictly validate the Claude Git Plugin
        run: claude plugin validate plugins/utsuri --strict
