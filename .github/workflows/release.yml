# Publishes all five @utsu-ri packages through npm trusted publishing.
# Configure each npm package with owner=hokupod, repository=utsuri,
# workflow=release.yml, and environment=release before creating a release tag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release ref and public history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Require the exact annotated main release tag
        env:
          UTSURI_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release-ref.mjs --tag "${UTSURI_RELEASE_TAG}" --main-ref origin/main
      - name: Require current human-reviewed release documentation
        run: node scripts/docs-check.mjs --mode release-candidate
      - name: Reject PII and secrets in the public release history
        env:
          UTSURI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/scan-public-history.mjs --ref "${UTSURI_RELEASE_TAG}"
          nix develop --command gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --log-opts="${UTSURI_RELEASE_TAG}" \
            .

  candidate:
    name: Exact multi-platform candidate
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/distribution-candidate.yml

  publish:
    name: Publish exact npm packages
    needs: candidate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utsuri-release-candidate
          path: .artifacts/release-candidate
      - name: Verify the immutable release candidate
        run: node scripts/release-assets.mjs verify --candidate .artifacts/release-candidate
      - name: Install and verify Safe-chain trust anchor
        run: |
          utsuri_safe_chain_version="$(node -p "require('./toolchain-policy.json').safeChain.version")"
          utsuri_safe_chain_asset="$(node -p "require('./toolchain-policy.json').safeChain.assets['linux-x64']")"
          utsuri_safe_chain_expected="$(node -p "require('./toolchain-policy.json').safeChain.sha256['linux-x64']")"
          utsuri_safe_chain_target="${HOME}/.safe-chain/bin/safe-chain"
          mkdir -p "$(dirname "${utsuri_safe_chain_target}")"
          curl --fail --silent --show-error --location \
            "https://github.com/AikidoSec/safe-chain/releases/download/${utsuri_safe_chain_version}/${utsuri_safe_chain_asset}" \
            --output "${utsuri_safe_chain_target}"
          node -e "const fs=require('node:fs');const c=require('node:crypto');const got=c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');if(got!==process.argv[2])throw new Error('Safe-chain digest mismatch')" \
            "${utsuri_safe_chain_target}" "${utsuri_safe_chain_expected}"
          chmod 0755 "${utsuri_safe_chain_target}"
          node scripts/safe-chain.mjs --version
          node scripts/safe-chain.mjs setup-ci
          node scripts/safe-chain.mjs npm safe-chain-verify
          node scripts/safe-chain.mjs bun safe-chain-verify
      - name: Pin trusted-publishing-capable npm
        run: npm install --global npm@11.18.0
      - name: Publish helpers before the CLI and verify registry integrity
        run: node scripts/publish-release-packages.mjs --candidate .artifacts/release-candidate

  published-smoke:
    name: Published native npx and bunx
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Verify strict published JSON and MCP NDJSON before Safe-chain setup
        run: node scripts/verify-published-cli.mjs --version-from-package

  github-release:
    name: Publish immutable GitHub release assets
    needs: published-smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utsuri-release-candidate
          path: .artifacts/release-candidate
      - name: Verify release assets again before the GitHub write
        run: node scripts/release-assets.mjs verify --candidate .artifacts/release-candidate
      - name: Extract release notes and commit inventory
        env:
          UTSURI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          utsuri_version="${UTSURI_RELEASE_TAG#v}"
          awk -v version="${utsuri_version}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            /^## \[/ { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          utsuri_previous_tag="$(git describe --tags --abbrev=0 "${UTSURI_RELEASE_TAG}^" 2>/dev/null || true)"
          {
            echo
            echo "### Commits"
            echo
            if [ -n "${utsuri_previous_tag}" ]; then
              git log --no-merges --pretty='- %s (%h)' "${utsuri_previous_tag}..${UTSURI_RELEASE_TAG}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${utsuri_previous_tag}...${UTSURI_RELEASE_TAG}"
            else
              git log --no-merges --pretty='- %s (%h)' "${UTSURI_RELEASE_TAG}"
            fi
          } >> release-notes.md
      - name: Create the GitHub release only after publication proof
        env:
          GH_TOKEN: ${{ github.token }}
          UTSURI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${UTSURI_RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${UTSURI_RELEASE_TAG} already exists; refusing to bypass asset verification." >&2
            exit 1
          fi
          utsuri_version="${UTSURI_RELEASE_TAG#v}"
          gh release create "${UTSURI_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${UTSURI_RELEASE_TAG}" \
            --draft \
            --verify-tag \
            --notes-file release-notes.md \
            .artifacts/release-candidate/SHA256SUMS \
            .artifacts/release-candidate/candidate-manifest.json \
            .artifacts/release-candidate/release-assets.json \
            ".artifacts/release-candidate/utsuri-plugin-${utsuri_version}.tar.gz" \
            .artifacts/release-candidate/tarballs/*.tgz
          gh release edit "${UTSURI_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
