name: Published Distribution Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Utsuri SemVer
        required: true
        type: string
      candidate_run_id:
        description: Distribution Candidate workflow run containing the approved artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: published-distribution-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14
      - name: Verify the exact published CLI before Safe-chain or dependency setup
        env:
          UTSURI_VERSION: ${{ inputs.version }}
        run: |
          test "$(node -p "require('./package.json').version")" = "${UTSURI_VERSION}"
          node scripts/verify-published-cli.mjs --version "${UTSURI_VERSION}"
      - name: Install and verify Safe-chain trust anchor
        run: |
          utsuri_safe_chain_version="$(node -p "require('./toolchain-policy.json').safeChain.version")"
          utsuri_safe_chain_asset="$(node -p "require('./toolchain-policy.json').safeChain.assets['linux-x64']")"
          utsuri_safe_chain_expected="$(node -p "require('./toolchain-policy.json').safeChain.sha256['linux-x64']")"
          utsuri_safe_chain_target="${HOME}/.safe-chain/bin/safe-chain"
          mkdir -p "$(dirname "${utsuri_safe_chain_target}")"
          curl --fail --silent --show-error --location \
            "https://github.com/AikidoSec/safe-chain/releases/download/${utsuri_safe_chain_version}/${utsuri_safe_chain_asset}" \
            --output "${utsuri_safe_chain_target}"
          node -e "const fs=require('node:fs');const c=require('node:crypto');const got=c.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');if(got!==process.argv[2])throw new Error('Safe-chain digest mismatch')" \
            "${utsuri_safe_chain_target}" "${utsuri_safe_chain_expected}"
          chmod 0755 "${utsuri_safe_chain_target}"
          node scripts/safe-chain.mjs --version
          node scripts/safe-chain.mjs setup-ci
          npx safe-chain-verify
          bunx safe-chain-verify
      - name: Install the exact development lockfile
        run: bun install --frozen-lockfile
      - name: Download the approved release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: utsuri-release-candidate
          path: .artifacts/release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the aggregate Plugin against the candidate manifest
        run: |
          node scripts/assemble-distribution-candidate.mjs \
            --restore-plugin-modes .artifacts/release-candidate/plugin \
            --manifest .artifacts/release-candidate/candidate-manifest.json
          node scripts/verify-release-layout.mjs --scan .artifacts/release-candidate/plugin
      - name: Verify the exact published helper package and immutable report path
        env:
          UTSURI_VERSION: ${{ inputs.version }}
        run: |
          utsuri_install_root="$(mktemp -d)"
          trap 'rm -rf "${utsuri_install_root}"' EXIT
          : > "${utsuri_install_root}/npmrc"
          npm install \
            --prefix "${utsuri_install_root}" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            --cache "${utsuri_install_root}/cache" \
            --userconfig "${utsuri_install_root}/npmrc" \
            "@utsu-ri/cli-linux-x64@${UTSURI_VERSION}" \
            "@utsu-ri/cli@${UTSURI_VERSION}"
          node scripts/verify-installed-cli.mjs \
            --root "${utsuri_install_root}" \
            --target linux-x64 \
            --version "${UTSURI_VERSION}"
      - name: Run Skill evals and Claude Plugin strict validation
        run: |
          bun run eval:skills
          npx --yes @anthropic-ai/claude-code@2.1.220 \
            plugin validate .artifacts/release-candidate/plugin --strict
      - name: Package only the verified aggregate Plugin
        run: |
          mkdir -p .artifacts/promoted-plugin
          tar \
            --sort=name \
            --mtime=@0 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf .artifacts/promoted-plugin/utsuri-plugin.tar.gz \
            -C .artifacts/release-candidate/plugin .
      - name: Upload the verified aggregate Plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utsuri-plugin-${{ inputs.version }}
          path: .artifacts/promoted-plugin/utsuri-plugin.tar.gz
          if-no-files-found: error
          retention-days: 30
